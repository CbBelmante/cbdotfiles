# ═══════════════════════════════════════════════════════════════════════════════
# CBDOTFILES KEYBINDS - Fonte Unica de Verdade
# ═══════════════════════════════════════════════════════════════════════════════
#
# Formato: TIPO | MODS | TECLA | DESCRICAO | CMD_HYPRLAND | CMD_COSMIC
#
# TIPOS:
#   BOTH = Gera para Hyprland e COSMIC
#   HYPR = Gera apenas para Hyprland
#   COSM = Gera apenas para COSMIC
#
# MODS: Super, Shift, Ctrl, Alt (separados por +)
# CMD_COSMIC: usa acoes COSMIC (System, Spawn, Close, Focus, etc.)
#
# Padrao de teclas (alinhado com Omarchy 4):
#   Super + Letra        = acoes do WM (F=fullscreen, W=close, etc)
#   Super + Shift + Letra = lancar apps (B=browser, N=editor, etc)
#   Super + Ctrl + Letra  = paineis/utilitarios do sistema
#
# IMPORTANTE: nao usar | (pipe) nos comandos — conflita com o delimitador.
# Para pipes no shell, use \| (escapado) — o gerador restaura automaticamente.
#
# Para gerar: ./keybinds/generate.sh
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# LAUNCHER
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super | space | App launcher | exec, omarchy-menu toggle | System(Launcher)
COSM | Super | NONE | Disable super-only launcher | | Disabled

# ─────────────────────────────────────────────────────────────────────────────
# CORE APPLICATIONS (Super+Shift = lancar apps)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super | Return | Terminal | exec, $terminal -e zsh | Spawn("$COSMIC_TERMINAL")
BOTH | Super+Shift | B | Browser (default) | exec, bash ~/Workspaces/cbdotfiles/keybinds/open-browser.sh | Spawn("bash ~/Workspaces/cbdotfiles/keybinds/open-browser.sh")
BOTH | Super+Shift+Alt | B | Browser (private) | exec, bash ~/Workspaces/cbdotfiles/keybinds/open-browser.sh --private | Spawn("bash ~/Workspaces/cbdotfiles/keybinds/open-browser.sh --private")
BOTH | Super+Shift | F | File manager | exec, $filemanager --new-window | Spawn("$COSMIC_FILEMANAGER")
BOTH | Super+Shift | N | Editor | exec, omarchy-launch-editor | Spawn("$COSMIC_EDITOR")
BOTH | Super+Shift | slash | Passwords (1Password) | exec, uwsm app -- 1password | Spawn("1password")

# ─────────────────────────────────────────────────────────────────────────────
# WINDOW MANAGEMENT (Super = acoes do WM)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super | W | Close window | exec, hyprctl dispatch killactive | Close
BOTH | Super | F | Full screen | exec, hyprctl dispatch fullscreen 0 | Maximize
BOTH | Super | Escape | System menu | exec, omarchy-menu toggle system | Spawn("bash ~/Workspaces/cbdotfiles/keybinds/power-menu.sh")

# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTIVITY (Super+Shift = lancar apps)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super+Shift | O | Obsidian | exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian --disable-gpu --enable-wayland-ime" | Spawn("obsidian")
BOTH | Super+Shift | G | GitKraken | exec, uwsm app -- gitkraken | Spawn("gitkraken")
BOTH | Super+Shift | M | Music (Spotify) | exec, omarchy-launch-or-focus spotify | Spawn("spotify")
BOTH | Super+Shift | D | Docker (LazyDocker) | exec, $terminal -e lazydocker | Spawn("$COSMIC_TERMINAL -e lazydocker")

# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM (Super+Ctrl = paineis e utilitarios)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super+Ctrl | T | Activity (btop) | exec, $terminal -e zsh -c btop | Spawn("$COSMIC_TERMINAL -e btop")

# ─────────────────────────────────────────────────────────────────────────────
# SCREENSHOTS
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super+Shift | S | Screenshot (interactive) | exec, omarchy-capture-screenshot | Spawn("cosmic-screenshot")
BOTH |  | Print | Screenshot (interactive) | exec, omarchy-capture-screenshot | Spawn("cosmic-screenshot")
HYPR | Super+Shift+Alt | S | Screen recording | exec, omarchy-capture-screenrecording --stop-recording \|\| omarchy-menu toggle trigger.capture.screenrecord |
HYPR | Alt | Print | Screen recording | exec, omarchy-capture-screenrecording --stop-recording \|\| omarchy-menu toggle trigger.capture.screenrecord |
HYPR | Super+Shift+Ctrl | S | Color picker | exec, pkill hyprpicker \|\| hyprpicker -a |
HYPR | Super | Print | Color picker | exec, pkill hyprpicker \|\| hyprpicker -a |

# ─────────────────────────────────────────────────────────────────────────────
# CLIPBOARD
# ─────────────────────────────────────────────────────────────────────────────
HYPR | Super | C | Copy | exec, wl-copy |
HYPR | Super | X | Cut | exec, wl-copy |
HYPR | Super | V | Paste | exec, wl-paste |
HYPR | Super+Ctrl | V | Clipboard history | exec, omarchy-shell shell toggle omarchy.clipboard |

# ─────────────────────────────────────────────────────────────────────────────
# CODING AGENT
# ─────────────────────────────────────────────────────────────────────────────
HYPR | Super+Shift+Ctrl | A | Coding agent | exec, omarchy-agent --pick |

# ─────────────────────────────────────────────────────────────────────────────
# WEBAPPS (Super+Shift = lancar apps)
# ─────────────────────────────────────────────────────────────────────────────
HYPR | Super+Shift | E | Email (Hey) | exec, $webappbrowser --app="https://app.hey.com" |
HYPR | Super+Shift | C | Claude AI | exec, $webappbrowser --app="https://claude.ai" |
HYPR | Super+Shift | Y | YouTube | exec, $webappbrowser --app="https://youtube.com/" |
HYPR | Super+Shift+Alt | G | WhatsApp | exec, $webappbrowser --app="https://web.whatsapp.com/" |

# ─────────────────────────────────────────────────────────────────────────────
# HYPRLAND EXTRAS
# ─────────────────────────────────────────────────────────────────────────────
HYPR | Super+Shift+Alt | T | Clock (tty-clock) | exec, $terminal -e tty-clock -c -s |
HYPR | Super+Shift+Alt | C | Calendar | exec, $terminal -e zsh -c "$date; read" |
HYPR | Super+Shift+Alt | V | Audio Visualizer (cava) | exec, $terminal -e cava |

# ─────────────────────────────────────────────────────────────────────────────
# AJUDA
# ─────────────────────────────────────────────────────────────────────────────
HYPR | Super | K | Keybind reference | exec, $terminal -e bash ~/Workspaces/cbdotfiles/keybinds/show-keybinds.sh |
COSM | Super | K | Keybind reference | | Spawn("$COSMIC_TERMINAL -e bash ~/Workspaces/cbdotfiles/keybinds/show-keybinds.sh")

# ─────────────────────────────────────────────────────────────────────────────
# VARIAVEIS
# ─────────────────────────────────────────────────────────────────────────────
# Definidas em keybinds/vars.conf (Hyprland + COSMIC)
# Mude la para trocar browser, terminal, etc.
