# ═══════════════════════════════════════════════════════════════════════════════
# CBDOTFILES KEYBINDS - Fonte Unica de Verdade
# ═══════════════════════════════════════════════════════════════════════════════
#
# Formato: TIPO | MODS | TECLA | DESCRICAO | CMD_HYPRLAND | CMD_COSMIC | CMD_AEROSPACE | CMD_GLAZEWM
#
# TIPOS:
#   BOTH = Gera para todos (Hyprland, COSMIC, AeroSpace, GlazeWM)
#   HYPR = Gera apenas para Hyprland
#   COSM = Gera apenas para COSMIC
#   AERO = Gera apenas para AeroSpace (macOS)
#   GLAZE = Gera apenas para GlazeWM (Windows)
#
# MODS: Super, Shift, Ctrl, Alt (separados por +)
#   No AeroSpace: Super vira cmd
#   No GlazeWM: Super vira alt
#
# Para gerar: ./keybinds/generate.sh
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# TILING - Foco entre janelas (Super+hjkl / Super+arrows)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super | H | Focus left | exec, hyprctl dispatch movefocus l | Focus(Left) | focus left | focus --direction left
BOTH | Super | J | Focus down | exec, hyprctl dispatch movefocus d | Focus(Down) | focus down | focus --direction down
BOTH | Super | L | Focus right | exec, hyprctl dispatch movefocus r | Focus(Right) | focus right | focus --direction right
BOTH | Super | Left | Focus left | exec, hyprctl dispatch movefocus l | Focus(Left) | focus left | focus --direction left
BOTH | Super | Down | Focus down | exec, hyprctl dispatch movefocus d | Focus(Down) | focus down | focus --direction down
BOTH | Super | Up | Focus up | exec, hyprctl dispatch movefocus u | Focus(Up) | focus up | focus --direction up
BOTH | Super | Right | Focus right | exec, hyprctl dispatch movefocus r | Focus(Right) | focus right | focus --direction right

# ─────────────────────────────────────────────────────────────────────────────
# TILING - Mover janelas (Super+Shift+hjkl)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super+Shift | H | Move window left | exec, hyprctl dispatch movewindow l | Move(Left) | move left | move --direction left
BOTH | Super+Shift | J | Move window down | exec, hyprctl dispatch movewindow d | Move(Down) | move down | move --direction down
BOTH | Super+Shift | K | Move window up | exec, hyprctl dispatch movewindow u | Move(Up) | move up | move --direction up
BOTH | Super+Shift | L | Move window right | exec, hyprctl dispatch movewindow r | Move(Right) | move right | move --direction right

# ─────────────────────────────────────────────────────────────────────────────
# TILING - Workspaces (Super+1-9)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super | 1 | Workspace 1 | exec, hyprctl dispatch workspace 1 | Workspace(1) | workspace 1 | focus --workspace 1
BOTH | Super | 2 | Workspace 2 | exec, hyprctl dispatch workspace 2 | Workspace(2) | workspace 2 | focus --workspace 2
BOTH | Super | 3 | Workspace 3 | exec, hyprctl dispatch workspace 3 | Workspace(3) | workspace 3 | focus --workspace 3
BOTH | Super | 4 | Workspace 4 | exec, hyprctl dispatch workspace 4 | Workspace(4) | workspace 4 | focus --workspace 4
BOTH | Super | 5 | Workspace 5 | exec, hyprctl dispatch workspace 5 | Workspace(5) | workspace 5 | focus --workspace 5
BOTH | Super | 6 | Workspace 6 | exec, hyprctl dispatch workspace 6 | Workspace(6) | workspace 6 | focus --workspace 6
BOTH | Super | 7 | Workspace 7 | exec, hyprctl dispatch workspace 7 | Workspace(7) | workspace 7 | focus --workspace 7
BOTH | Super | 8 | Workspace 8 | exec, hyprctl dispatch workspace 8 | Workspace(8) | workspace 8 | focus --workspace 8
BOTH | Super | 9 | Workspace 9 | exec, hyprctl dispatch workspace 9 | Workspace(9) | workspace 9 | focus --workspace 9

# ─────────────────────────────────────────────────────────────────────────────
# TILING - Mover pra workspace (Super+Shift+1-9)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super+Shift | 1 | Move to workspace 1 | exec, hyprctl dispatch movetoworkspace 1 | MoveToWorkspace(1) | move-node-to-workspace 1 | move --workspace 1
BOTH | Super+Shift | 2 | Move to workspace 2 | exec, hyprctl dispatch movetoworkspace 2 | MoveToWorkspace(2) | move-node-to-workspace 2 | move --workspace 2
BOTH | Super+Shift | 3 | Move to workspace 3 | exec, hyprctl dispatch movetoworkspace 3 | MoveToWorkspace(3) | move-node-to-workspace 3 | move --workspace 3
BOTH | Super+Shift | 4 | Move to workspace 4 | exec, hyprctl dispatch movetoworkspace 4 | MoveToWorkspace(4) | move-node-to-workspace 4 | move --workspace 4
BOTH | Super+Shift | 5 | Move to workspace 5 | exec, hyprctl dispatch movetoworkspace 5 | MoveToWorkspace(5) | move-node-to-workspace 5 | move --workspace 5
BOTH | Super+Shift | 6 | Move to workspace 6 | exec, hyprctl dispatch movetoworkspace 6 | MoveToWorkspace(6) | move-node-to-workspace 6 | move --workspace 6
BOTH | Super+Shift | 7 | Move to workspace 7 | exec, hyprctl dispatch movetoworkspace 7 | MoveToWorkspace(7) | move-node-to-workspace 7 | move --workspace 7
BOTH | Super+Shift | 8 | Move to workspace 8 | exec, hyprctl dispatch movetoworkspace 8 | MoveToWorkspace(8) | move-node-to-workspace 8 | move --workspace 8
BOTH | Super+Shift | 9 | Move to workspace 9 | exec, hyprctl dispatch movetoworkspace 9 | MoveToWorkspace(9) | move-node-to-workspace 9 | move --workspace 9

# ─────────────────────────────────────────────────────────────────────────────
# TILING - Layout e float
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super | T | Toggle float | exec, hyprctl dispatch togglefloating | ToggleWindowFloating | layout floating tiling | toggle-floating --centered
BOTH | Super | comma | Resize smaller | exec, hyprctl dispatch splitratio -0.1 | | resize smart -50 | resize --width -2%
BOTH | Super | period | Resize bigger | exec, hyprctl dispatch splitratio 0.1 | | resize smart +50 | resize --width +2%

# ─────────────────────────────────────────────────────────────────────────────
# LAUNCHER
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super | space | App launcher | exec, omarchy-menu toggle | System(Launcher) | |
AERO | Ctrl | space | App launcher (macOS) | | | exec-and-forget open /Applications/Raycast.app |
COSM | Super | NONE | Disable super-only launcher | | Disabled | |

# ─────────────────────────────────────────────────────────────────────────────
# CORE APPLICATIONS (Super+Shift = lancar apps)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super | Return | Terminal | exec, $terminal -e zsh | Spawn("$COSMIC_TERMINAL") | exec-and-forget open -na "$AERO_TERMINAL" | shell-exec $WIN_TERMINAL
BOTH | Super+Shift | B | Browser (default) | exec, bash ~/Workspaces/cbdotfiles/keybinds/open-browser.sh | Spawn("bash ~/Workspaces/cbdotfiles/keybinds/open-browser.sh") | exec-and-forget open -na "$AERO_BROWSER" | shell-exec $WIN_BROWSER
BOTH | Super+Shift+Alt | B | Browser (private) | exec, bash ~/Workspaces/cbdotfiles/keybinds/open-browser.sh --private | Spawn("bash ~/Workspaces/cbdotfiles/keybinds/open-browser.sh --private") | exec-and-forget open -na "$AERO_BROWSER" --args --private-window | shell-exec $WIN_BROWSER --incognito
BOTH | Super+Shift | F | File manager | exec, $filemanager --new-window | Spawn("$COSMIC_FILEMANAGER") | exec-and-forget open -a Finder ~ | shell-exec $WIN_FILEMANAGER
BOTH | Super+Shift | N | Editor | exec, omarchy-launch-editor | Spawn("$COSMIC_EDITOR") | exec-and-forget open -na "$AERO_EDITOR" | shell-exec $WIN_EDITOR
BOTH | Super+Shift | slash | Passwords (1Password) | exec, uwsm app -- 1password | Spawn("1password") | exec-and-forget open -na "1Password" | shell-exec 1password

# ─────────────────────────────────────────────────────────────────────────────
# WINDOW MANAGEMENT (Super = acoes do WM)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super | W | Close window | exec, hyprctl dispatch killactive | Close | | close
AERO | Ctrl | W | Close window | | | close --quit-if-last-window |
BOTH | Super | F | Full screen | exec, hyprctl dispatch fullscreen 0 | Maximize | fullscreen | toggle-fullscreen
BOTH | Super | Escape | System menu | exec, omarchy-menu toggle system | Spawn("bash ~/Workspaces/cbdotfiles/keybinds/power-menu.sh") | |

# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTIVITY (Super+Shift = lancar apps)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super+Shift | O | Obsidian | exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian --disable-gpu --enable-wayland-ime" | Spawn("obsidian") | exec-and-forget open -na "Obsidian" | shell-exec obsidian
BOTH | Super+Shift | G | GitKraken | exec, uwsm app -- gitkraken | Spawn("gitkraken") | exec-and-forget open -na "GitKraken" | shell-exec gitkraken
BOTH | Super+Shift | M | Music (Spotify) | exec, omarchy-launch-or-focus spotify | Spawn("spotify") | exec-and-forget open -na "Spotify" | shell-exec spotify
BOTH | Super+Shift | D | Docker (LazyDocker) | exec, $terminal -e lazydocker | Spawn("$COSMIC_TERMINAL -e lazydocker") | exec-and-forget open -na "$AERO_TERMINAL" --args -e lazydocker | shell-exec $WIN_TERMINAL -e lazydocker

# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM (Super+Ctrl = paineis e utilitarios)
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super+Ctrl | T | Activity (btop) | exec, $terminal -e zsh -c btop | Spawn("$COSMIC_TERMINAL -e btop") | exec-and-forget open -na "$AERO_TERMINAL" --args -e btop | shell-exec $WIN_TERMINAL -e btop

# ─────────────────────────────────────────────────────────────────────────────
# SCREENSHOTS
# ─────────────────────────────────────────────────────────────────────────────
BOTH | Super+Shift | S | Screenshot (interactive) | exec, omarchy-capture-screenshot | Spawn("cosmic-screenshot") | exec-and-forget screencapture -i ~/Desktop/screenshot.png | shell-exec snippingtool
BOTH |  | Print | Screenshot (interactive) | exec, omarchy-capture-screenshot | Spawn("cosmic-screenshot") | |
HYPR | Super+Shift+Alt | S | Screen recording | exec, omarchy-capture-screenrecording --stop-recording \|\| omarchy-menu toggle trigger.capture.screenrecord | | |
HYPR | Alt | Print | Screen recording | exec, omarchy-capture-screenrecording --stop-recording \|\| omarchy-menu toggle trigger.capture.screenrecord | | |
HYPR | Super+Shift+Ctrl | S | Color picker | exec, pkill hyprpicker \|\| hyprpicker -a | | |
HYPR | Super | Print | Color picker | exec, pkill hyprpicker \|\| hyprpicker -a | | |

# ─────────────────────────────────────────────────────────────────────────────
# CLIPBOARD
# ─────────────────────────────────────────────────────────────────────────────
HYPR | Super | C | Copy | exec, wl-copy | | |
HYPR | Super | X | Cut | exec, wl-copy | | |
HYPR | Super | V | Paste | exec, wl-paste | | |
HYPR | Super+Ctrl | V | Clipboard history | exec, omarchy-shell shell toggle omarchy.clipboard | | |

# ─────────────────────────────────────────────────────────────────────────────
# CODING AGENT
# ─────────────────────────────────────────────────────────────────────────────
HYPR | Super+Shift+Ctrl | A | Coding agent | exec, omarchy-agent --pick | | |

# ─────────────────────────────────────────────────────────────────────────────
# WEBAPPS (Super+Shift = lancar apps)
# ─────────────────────────────────────────────────────────────────────────────
HYPR | Super+Shift | E | Email (Hey) | exec, $webappbrowser --app="https://app.hey.com" | | |
HYPR | Super+Shift | C | Claude AI | exec, $webappbrowser --app="https://claude.ai" | | |
HYPR | Super+Shift | Y | YouTube | exec, $webappbrowser --app="https://youtube.com/" | | |
HYPR | Super+Shift+Alt | G | WhatsApp | exec, $webappbrowser --app="https://web.whatsapp.com/" | | |

# ─────────────────────────────────────────────────────────────────────────────
# HYPRLAND EXTRAS
# ─────────────────────────────────────────────────────────────────────────────
HYPR | Super+Shift+Alt | T | Clock (tty-clock) | exec, $terminal -e tty-clock -c -s | | |
HYPR | Super+Shift+Alt | C | Calendar | exec, $terminal -e zsh -c "$date; read" | | |
HYPR | Super+Shift+Alt | V | Audio Visualizer (cava) | exec, $terminal -e cava | | |

# ─────────────────────────────────────────────────────────────────────────────
# AJUDA
# ─────────────────────────────────────────────────────────────────────────────
HYPR | Super | K | Keybind reference | exec, $terminal -e bash ~/Workspaces/cbdotfiles/keybinds/show-keybinds.sh | | |
COSM | Super | K | Keybind reference | | Spawn("$COSMIC_TERMINAL -e bash ~/Workspaces/cbdotfiles/keybinds/show-keybinds.sh") | |

# ─────────────────────────────────────────────────────────────────────────────
# GLAZEWM EXTRAS
# ─────────────────────────────────────────────────────────────────────────────
GLAZE | Super | V | Toggle tiling direction | | | | toggle-tiling-direction
GLAZE | Super+Shift | R | Reload GlazeWM config | | | | wm-reload-config

# ─────────────────────────────────────────────────────────────────────────────
# VARIAVEIS
# ─────────────────────────────────────────────────────────────────────────────
# Definidas em keybinds/vars.conf (Hyprland + COSMIC + AeroSpace + GlazeWM)
# Mude la para trocar browser, terminal, etc.
