# ═══════════════════════════════════════════════════════════════════════════════
# AEROSPACE CONFIG - GERADO AUTOMATICAMENTE
# ═══════════════════════════════════════════════════════════════════════════════
#
# NÃO EDITE AQUI! Edite keybinds/keybinds.conf e keybinds/vars.conf
# Depois rode: ./keybinds/generate.sh
#
# Docs: https://nikitabobko.github.io/AeroSpace/guide
# ═══════════════════════════════════════════════════════════════════════════════

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

# ═══════════════════════════════════════════════════════════════════════════════
# KEYBINDS (gerados de keybinds.conf — Super vira alt no macOS)
# ═══════════════════════════════════════════════════════════════════════════════

[mode.main.binding]
# Focus left
alt-h = 'focus left'

# Focus down
alt-j = 'focus down'

# Focus right
alt-l = 'focus right'

# Focus left
alt-left = 'focus left'

# Focus down
alt-down = 'focus down'

# Focus up
alt-up = 'focus up'

# Focus right
alt-right = 'focus right'

# Move window left
alt-shift-h = 'move left'

# Move window down
alt-shift-j = 'move down'

# Move window up
alt-shift-k = 'move up'

# Move window right
alt-shift-l = 'move right'

# Workspace 1
alt-1 = 'workspace 1'

# Workspace 2
alt-2 = 'workspace 2'

# Workspace 3
alt-3 = 'workspace 3'

# Workspace 4
alt-4 = 'workspace 4'

# Workspace 5
alt-5 = 'workspace 5'

# Workspace 6
alt-6 = 'workspace 6'

# Workspace 7
alt-7 = 'workspace 7'

# Workspace 8
alt-8 = 'workspace 8'

# Workspace 9
alt-9 = 'workspace 9'

# Move to workspace 1
alt-shift-1 = 'move-node-to-workspace 1'

# Move to workspace 2
alt-shift-2 = 'move-node-to-workspace 2'

# Move to workspace 3
alt-shift-3 = 'move-node-to-workspace 3'

# Move to workspace 4
alt-shift-4 = 'move-node-to-workspace 4'

# Move to workspace 5
alt-shift-5 = 'move-node-to-workspace 5'

# Move to workspace 6
alt-shift-6 = 'move-node-to-workspace 6'

# Move to workspace 7
alt-shift-7 = 'move-node-to-workspace 7'

# Move to workspace 8
alt-shift-8 = 'move-node-to-workspace 8'

# Move to workspace 9
alt-shift-9 = 'move-node-to-workspace 9'

# Toggle float
alt-t = 'layout floating tiling'

# Split horizontal
alt-comma = 'resize smart -50'

# Split vertical
alt-period = 'resize smart +50'

# Terminal
alt-enter = 'exec-and-forget open -na "Ghostty"'

# Browser (default)
alt-shift-b = 'exec-and-forget open -na "Vivaldi"'

# Browser (private)
alt-shift-alt-b = 'exec-and-forget open -na "Vivaldi" --args --incognito'

# File manager
alt-shift-f = 'exec-and-forget open -na "Finder"'

# Editor
alt-shift-n = 'exec-and-forget open -na "Visual Studio Code"'

# Passwords (1Password)
alt-shift-slash = 'exec-and-forget open -na "1Password"'

# Close window
alt-w = 'close'

# Full screen
alt-f = 'fullscreen'

# Obsidian
alt-shift-o = 'exec-and-forget open -na "Obsidian"'

# GitKraken
alt-shift-g = 'exec-and-forget open -na "GitKraken"'

# Music (Spotify)
alt-shift-m = 'exec-and-forget open -na "Spotify"'

# Docker (LazyDocker)
alt-shift-d = 'exec-and-forget open -na "Ghostty" --args -e lazydocker'

# Activity (btop)
alt-ctrl-t = 'exec-and-forget open -na "Ghostty" --args -e btop'

# Screenshot (interactive)
alt-shift-s = 'exec-and-forget screencapture -i ~/Desktop/screenshot.png'

