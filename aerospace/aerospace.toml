# ═══════════════════════════════════════════════════════════════════════════════
# AEROSPACE CONFIG - GERADO AUTOMATICAMENTE
# ═══════════════════════════════════════════════════════════════════════════════
#
# NÃO EDITE AQUI! Edite keybinds/keybinds.conf e keybinds/vars.conf
# Depois rode: ./keybinds/generate.sh
#
# Docs: https://nikitabobko.github.io/AeroSpace/guide
# ═══════════════════════════════════════════════════════════════════════════════

config-version = 2

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

# ═══════════════════════════════════════════════════════════════════════════════
# KEYBINDS (gerados de keybinds.conf — Super vira alt no macOS)
# ═══════════════════════════════════════════════════════════════════════════════

[mode.main.binding]
# Focus left
cmd-h = 'focus left'

# Focus down
cmd-j = 'focus down'

# Focus right
cmd-l = 'focus right'

# Focus left
cmd-left = 'focus left'

# Focus down
cmd-down = 'focus down'

# Focus up
cmd-up = 'focus up'

# Focus right
cmd-right = 'focus right'

# Move window left
cmd-shift-h = 'move left'

# Move window down
cmd-shift-j = 'move down'

# Move window up
cmd-shift-k = 'move up'

# Move window right
cmd-shift-l = 'move right'

# Workspace 1
cmd-1 = 'workspace 1'

# Workspace 2
cmd-2 = 'workspace 2'

# Workspace 3
cmd-3 = 'workspace 3'

# Workspace 4
cmd-4 = 'workspace 4'

# Workspace 5
cmd-5 = 'workspace 5'

# Workspace 6
cmd-6 = 'workspace 6'

# Workspace 7
cmd-7 = 'workspace 7'

# Workspace 8
cmd-8 = 'workspace 8'

# Workspace 9
cmd-9 = 'workspace 9'

# Move to workspace 1
cmd-shift-1 = 'move-node-to-workspace 1'

# Move to workspace 2
cmd-shift-2 = 'move-node-to-workspace 2'

# Move to workspace 3
cmd-shift-3 = 'move-node-to-workspace 3'

# Move to workspace 4
cmd-shift-4 = 'move-node-to-workspace 4'

# Move to workspace 5
cmd-shift-5 = 'move-node-to-workspace 5'

# Move to workspace 6
cmd-shift-6 = 'move-node-to-workspace 6'

# Move to workspace 7
cmd-shift-7 = 'move-node-to-workspace 7'

# Move to workspace 8
cmd-shift-8 = 'move-node-to-workspace 8'

# Move to workspace 9
cmd-shift-9 = 'move-node-to-workspace 9'

# Toggle float
cmd-t = 'layout floating tiling'

# Split horizontal
cmd-comma = 'resize smart -50'

# Split vertical
cmd-period = 'resize smart +50'

# App launcher (macOS)
alt-space = 'exec-and-forget open -a 'Raycast''

# Terminal
cmd-enter = 'exec-and-forget open -na "Ghostty"'

# Browser (default)
cmd-shift-b = 'exec-and-forget open -na "Vivaldi"'

# Browser (private)
cmd-shift-alt-b = 'exec-and-forget open -na "Vivaldi" --args --private-window'

# File manager
cmd-shift-f = 'exec-and-forget open -na "Finder"'

# Editor
cmd-shift-n = 'exec-and-forget open -na "Visual Studio Code"'

# Passwords (1Password)
cmd-shift-slash = 'exec-and-forget open -na "1Password"'

# Close window
cmd-w = 'close'

# Full screen
cmd-f = 'fullscreen'

# Obsidian
cmd-shift-o = 'exec-and-forget open -na "Obsidian"'

# GitKraken
cmd-shift-g = 'exec-and-forget open -na "GitKraken"'

# Music (Spotify)
cmd-shift-m = 'exec-and-forget open -na "Spotify"'

# Docker (LazyDocker)
cmd-shift-d = 'exec-and-forget open -na "Ghostty" --args -e lazydocker'

# Activity (btop)
cmd-ctrl-t = 'exec-and-forget open -na "Ghostty" --args -e btop'

# Screenshot (interactive)
cmd-shift-s = 'exec-and-forget screencapture -i ~/Desktop/screenshot.png'

